name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Performance & bundle report (advisory)
        continue-on-error: true
        run: bun run perf:report

  browser-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: which google-chrome || bunx playwright install --with-deps chromium
      - name: Run browser smoke tests (3x burn-in on PRs)
        env:
          PLAYWRIGHT_RETRIES: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx playwright test --repeat-each=3
          else
            bun run test:e2e
          fi
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser smoothness report (advisory)
        continue-on-error: true
        run: bun run bench:browser --headless
